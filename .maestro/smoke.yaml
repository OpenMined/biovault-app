appId: org.openmined.biovault.dev
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "I understand.*|Explore Assays|This is the developer menu.*"
    timeout: 60000
- takeScreenshot: screenshots/01-launch
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - swipe:
          start: "50%,60%"
          end: "50%,100%"
- runFlow:
    when:
      visible: "I understand.*"
    commands:
      - tapOn: "I understand.*"
      - tapOn: "Continue"
- extendedWaitUntil:
    visible: "Explore Assays"
    timeout: 30000
- takeScreenshot: screenshots/02-home
