# Optional historical browser targets for narrowing minimum browser versions.
# These rows are intentionally executable only when the named local binary,
# provider endpoint, or Docker image is available in the current environment.

targets:
  - id: chromium-system
    family: chromium
    version_label: system
    project: chromium
    executable_env: CHROMIUM_EXECUTABLE
    fallback_executable: /usr/bin/chromium
    required: optional

  - id: chromium-cache-141
    family: chromium
    version_label: 141
    project: chromium
    executable_env: CHROMIUM_141_EXECUTABLE
    fallback_executable: ~/.cache/ms-playwright/chromium-1194/chrome-linux/chrome
    required: optional

  - id: chromium-cache-127
    family: chromium
    version_label: 127
    project: chromium
    executable_env: CHROMIUM_127_EXECUTABLE
    fallback_executable: ~/.cache/ms-playwright/chromium-1124/chrome-linux/chrome
    required: optional

  - id: chromium-cache-115
    family: chromium
    version_label: 115
    project: chromium
    executable_env: CHROMIUM_115_EXECUTABLE
    fallback_executable: ~/.cache/ms-playwright/chromium-1067/chrome-linux/chrome
    required: optional

  - id: chromium-cache-105
    family: chromium
    version_label: 105
    project: chromium
    executable_env: CHROMIUM_105_EXECUTABLE
    fallback_executable: ~/.cache/ms-playwright/chromium-1019/chrome-linux/chrome
