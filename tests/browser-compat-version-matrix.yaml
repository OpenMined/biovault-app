  - id: firefox-cache-127
    family: firefox
    version_label: 127
    project: firefox
    executable_env: FIREFOX_127_EXECUTABLE
    fallback_executable: ~/.cache/ms-playwright/firefox-1454/firefox/firefox
    runner_package: "@playwright/test"
    runner_version: "1.45.0"
    required: optional

  - id: firefox-docker-99
    family: firefox
    version_label: 99
    project: firefox
    docker_image: mcr.microsoft.com/playwright:v1.22.0-focal
    runner_package: "@playwright/test"
    runner_version: "1.22.0"
    required: optional
    expected_status: fail

  - id: webkit-docker-17
    family: safari
    version_label: 17
