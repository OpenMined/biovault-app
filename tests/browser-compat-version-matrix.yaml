  - id: chromium-cache-96
    family: chromium
    version_label: 96
    project: chromium
    executable_env: CHROMIUM_96_EXECUTABLE
    fallback_executable: ~/.cache/ms-playwright/chromium-920619/chrome-linux/chrome
    required: optional

  - id: chromium-cache-94
    family: chromium
