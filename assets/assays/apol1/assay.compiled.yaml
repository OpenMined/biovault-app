assay:
  id: apol1_risk
  label: APOL1 Risk Classifier
  summary: Classify APOL1 G0, G1, and G2 haplotype combinations from three defining
    sites.
  category: risk
  tags:
  - apol1
  - kidney
  - risk
  disclaimer: Research use only. Not medical advice.
  package_version: 0.1.0
  source_of_truth: script
implementation:
  kind: script
  script_path: apol1.py
ui:
