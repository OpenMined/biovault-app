name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  # Optionally, allow manual trigger for debugging
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: Branch, tag, or SHA to deploy
        required: true
        default: main

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Check TruffleHog exclude scope
        run: node ./scripts/check-trufflehog-excludes.mjs

      - name: Run local secrets scan wrapper
        run: npm run secrets:scan

      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --exclude-paths=.trufflehog-exclude --results=verified,unknown

  rust:
    if: github.event_name == 'pull_request'
    # Runs ./test.sh, which exercises the app's Rust code (desktop/src-tauri).
    # bioscript is a submodule with its own CI.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CI submodules
        run: ./scripts/init-ci-submodules.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Show Rust versions
        run: |
          rustc --version
          cargo --version
          rustfmt --version

      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Cache Rust (desktop/src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: test

      - name: Run ./test.sh
        run: ./test.sh

  lint:
    if: github.event_name == 'pull_request'
    # Runs the same ./lint.sh that developers use locally, so CI output
    # matches local output exactly. Covers Rust (bioscript/rust +
    # desktop/src-tauri) and TypeScript (root, desktop, packages/*).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CI submodules
        run: ./scripts/init-ci-submodules.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Cache Rust (bioscript/rust + desktop/src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bioscript/rust
            desktop/src-tauri
          key: lint

      - name: Install root npm deps
        run: npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install desktop npm deps
        run: cd desktop && npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ./lint.sh --check
        run: ./lint.sh --check

      - name: Check runtime asset references
        run: npm run check:runtime-assets

  web-core:
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-linux-medium
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk: [import, assays, state]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CI submodules
        run: ./scripts/init-ci-submodules.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install npm dependencies
        run: npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify required submodules
        run: |
          test -f bioscript/rust/Cargo.toml
          test -f exvitae/assays/risk/APOL1/apol1.py
          test -f exvitae/assays/risk/APOL1/test-data/apol1.cram
          git submodule status bioscript exvitae

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Cache genomic test fixtures
        uses: actions/cache@v4
        with:
          path: ~/.bioscript/cache/test-data
          key: bioscript-test-data-web-pgx-v1
          restore-keys: bioscript-test-data-

      - name: Fetch web genomic test fixtures
        run: uv run --with pyyaml ./tools/fetch_test_data.sh --web-pgx-public

      - name: Verify web genomic test fixtures
        run: |
          test -f test-data/23andme/v2/hu0199C8/23data20100526.txt.zip
          test -f test-data/23andme/v3/huE4DAE4/huE4DAE4_20120522224129.txt.zip
          test -f test-data/23andme/v4/huE18D82/genome__v4_Full_2016.txt.zip
          test -f test-data/23andme/v5/hu50B3F5/genome_hu50B3F5_v5_Full.zip
          test -f test-data/dynamicdna/100001-synthetic/100001_X_X_GSAv3-DTC_GRCh38-07-12-2025.txt.zip
          test -f test-data/ancestrydna/huE922FC/AncestryDNA.txt.zip
          test -f test-data/familytreedna/hu17B792/2017-04-29_Family_Tree_DNA_Data.csv.zip
          test -f test-data/genesforgood/hu80B047/GFG0_filtered_imputed_genotypes_noY_noMT_23andMe.txt.zip
          test -f test-data/myheritage/hu33515F/MyHeritage_raw_dna_data.zip
          test -f test-data/1k-genomes/vcf/NA06985.clean.vcf.gz
          test -f test-data/1k-genomes/vcf/NA06985.clean.vcf.gz.tbi
          ls -la test-data/23andme/v5/hu50B3F5
          ls -la test-data/1k-genomes/vcf

      - name: Check BioScript app/core boundary
        run: npm run check:bioscript-boundary

      - name: Run web tests
        run: ./test-web-core.sh --core-${{ matrix.chunk }}

      - name: Upload web artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-core-${{ matrix.chunk }}-artifacts
          path: |
            .maestro-web/screenshots
            test-results
          if-no-files-found: ignore

  web-report-parity:
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-linux-medium
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CI submodules
        run: ./scripts/init-ci-submodules.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Cache Rust (bioscript parity)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bioscript/rust
          key: web-bioscript-parity

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install npm dependencies
        run: npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify required submodules
        run: |
          test -f bioscript/rust/Cargo.toml
          test -f exvitae/assays/risk/APOL1/apol1.py
          test -f exvitae/assays/risk/APOL1/test-data/apol1.cram
          git submodule status bioscript exvitae

      - name: Cache genomic test fixtures
        uses: actions/cache@v4
        with:
          path: ~/.bioscript/cache/test-data
          key: bioscript-test-data-web-pgx-v1
          restore-keys: bioscript-test-data-

      - name: Fetch web genomic test fixtures
        run: uv run --with pyyaml ./tools/fetch_test_data.sh --web-pgx-public

      - name: Verify report parity fixtures
        run: |
          test -f test-data/23andme/v5/hu50B3F5/genome_hu50B3F5_v5_Full.zip
          test -f test-data/1k-genomes/vcf/NA06985.clean.vcf.gz
          test -f test-data/1k-genomes/vcf/NA06985.clean.vcf.gz.tbi

      - name: Check BioScript CLI/WASM parity
        run: npm run check:bioscript-parity

  web-browser-matrix:
    if: github.event_name == 'pull_request'
    runs-on: namespace-profile-linux-medium
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CI submodules
        run: ./scripts/init-ci-submodules.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install npm dependencies
        run: npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify required submodules
        run: |
          test -f bioscript/rust/Cargo.toml
          test -f exvitae/assays/risk/APOL1/apol1.py
          test -f exvitae/assays/risk/APOL1/test-data/apol1.cram
          git submodule status bioscript exvitae

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Cache genomic test fixtures
        uses: actions/cache@v4
        with:
          path: ~/.bioscript/cache/test-data
          key: bioscript-test-data-web-pgx-v1
          restore-keys: bioscript-test-data-

      - name: Fetch web genomic test fixtures
        run: uv run --with pyyaml ./tools/fetch_test_data.sh --web-pgx-public

      - name: Verify browser matrix fixtures
        run: |
          test -f test-data/23andme/v5/hu50B3F5/genome_hu50B3F5_v5_Full.zip
          test -f test-data/1k-genomes/vcf/NA06985.clean.vcf.gz
          test -f test-data/1k-genomes/vcf/NA06985.clean.vcf.gz.tbi
          test -f exvitae/assays/risk/APOL1/APOL1.yaml
          test -f exvitae/assays/risk/APOL1/APOL1.zip
          test -f exvitae/assays/risk/APOL1/test-data/apol1.bam
          test -f exvitae/assays/risk/APOL1/test-data/apol1.bam.bai
          test -f exvitae/assays/risk/APOL1/test-data/apol1.cram
          test -f exvitae/assays/risk/APOL1/test-data/apol1.cram.crai
          test -f exvitae/assays/risk/APOL1/test-data/stub.fa
          test -f exvitae/assays/risk/APOL1/test-data/stub.fa.fai

      - name: Run selected PGx report browser matrix
        run: WEB_SECURE_ORIGIN=1 PW_IGNORE_HTTPS_ERRORS=1 PW_WORKERS=2 WEB_REPORT_NO_PRIVATE=1 WEB_REPORT_SAMPLE_IDS=23andme-v5-hu50B3F5,NA06985-vcf,apol1-bam,apol1-cram ./test-web.sh --pgx-report-scenario

      - name: Upload browser matrix artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-matrix-artifacts
          path: |
            .maestro-web/screenshots
            test-results
          if-no-files-found: ignore

  deploy-web-prod:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: namespace-profile-linux-medium
    timeout-minutes: 30
    concurrency:
      group: cloudflare-web-prod
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_ref || github.ref }}
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CI submodules
        run: ./scripts/init-ci-submodules.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install npm dependencies
        run: npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy web app to Cloudflare
        run: npm run deploy-web-prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  desktop-linux:
    # Disabled while focusing CI on rust, lint, and web stability.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CI submodules
        run: ./scripts/init-ci-submodules.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev xvfb

      - name: Cache Rust (desktop Linux)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bioscript/rust
            desktop/src-tauri
          key: desktop-linux

      - name: Install root npm dependencies
        run: npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install desktop npm dependencies
        run: cd desktop && npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Cache genomic test fixtures
        uses: actions/cache@v4
        with:
          path: ~/.bioscript/cache/test-data
          key: bioscript-test-data-desktop-linux-v2
          restore-keys: bioscript-test-data-

      - name: Install Python test-data parser dependency
        run: python3 -m pip install PyYAML

      - name: Fetch desktop genomic test fixtures
        run: |
          BIOSCRIPT_TEST_DATA_REPO_ROOT="$PWD" ./bioscript/tools/fetch_test_data.sh --dataset 23andme --only genome_hu50B3F5_v5_Full.zip
          BIOSCRIPT_TEST_DATA_REPO_ROOT="$PWD" ./bioscript/tools/fetch_test_data.sh --dataset 1k-genomes --only "NA06985.clean.vcf.gz*"

      - name: Verify desktop genomic test fixtures
        run: |
          test -f test-data/23andme/v5/hu50B3F5/genome_hu50B3F5_v5_Full.zip
          test -f test-data/1k-genomes/vcf/NA06985.clean.vcf.gz
          test -f test-data/1k-genomes/vcf/NA06985.clean.vcf.gz.tbi

      - name: Run desktop UI tests
        run: xvfb-run -a ./test-desktop.sh

      - name: Run native Rust Lab tests
        run: ./test-lib.sh

      - name: Upload desktop Linux artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-artifacts
          path: |
            .maestro-desktop/screenshots
            .maestro-desktop/logs
            test-results
          if-no-files-found: ignore

  desktop-macos:
    # Disabled while focusing CI on rust, lint, and web stability.
    if: false
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CI submodules
        run: ./scripts/init-ci-submodules.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (desktop macOS)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bioscript/rust
            desktop/src-tauri
          key: desktop-macos

      - name: Install root npm dependencies
        run: npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install desktop npm dependencies
        run: cd desktop && npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Cache genomic test fixtures
        uses: actions/cache@v4
        with:
          path: ~/.bioscript/cache/test-data
          key: bioscript-test-data-desktop-macos-v2
          restore-keys: bioscript-test-data-

      - name: Install Python test-data parser dependency
        run: python3 -m pip install PyYAML

      - name: Fetch desktop genomic test fixtures
        run: |
          BIOSCRIPT_TEST_DATA_REPO_ROOT="$PWD" ./bioscript/tools/fetch_test_data.sh --dataset 23andme --only genome_hu50B3F5_v5_Full.zip
          BIOSCRIPT_TEST_DATA_REPO_ROOT="$PWD" ./bioscript/tools/fetch_test_data.sh --dataset 1k-genomes --only "NA06985.clean.vcf.gz*"

      - name: Verify desktop genomic test fixtures
        run: |
          test -f test-data/23andme/v5/hu50B3F5/genome_hu50B3F5_v5_Full.zip
          test -f test-data/1k-genomes/vcf/NA06985.clean.vcf.gz
          test -f test-data/1k-genomes/vcf/NA06985.clean.vcf.gz.tbi

      - name: Run desktop UI tests
        run: ./test-desktop.sh

      - name: Run native Rust Lab tests
        run: ./test-lib.sh

      - name: Upload desktop macOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-artifacts
          path: |
            .maestro-desktop/screenshots
            .maestro-desktop/logs
            test-results
          if-no-files-found: ignore

  ios:
    # Disabled while focusing CI on rust, lint, and web stability.
    if: false
    # Namespace default is now Tahoe 26.3.1 + Xcode 26.3 — matches local
    # dev (Xcode 26.x). Should handle expo-modules-core's Swift concurrency.
    runs-on: namespace-profile-mac-medium
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CI submodules
        run: ./scripts/init-ci-submodules.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Java (Maestro JVM)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # expo-bioscript's build-rust-ios.sh requires all three iOS
          # targets to be installed (device, Intel sim, Apple Silicon sim).
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust (iOS targets)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bioscript/rust
          key: ios

      - name: Select Xcode
        # Prefer the runner's default Xcode (has its matching iOS platform
        # and sim runtime already installed). Only fall back to a pinned
        # version if the default is older than what RN 0.83 requires (16.1).
        run: |
          DEFAULT_VER=$(xcodebuild -version 2>/dev/null | awk '/^Xcode/{print $2}')
          echo "Default Xcode: $DEFAULT_VER"
          MIN="16.1"
          if [ "$(printf '%s\n%s\n' "$MIN" "$DEFAULT_VER" | sort -V | head -1)" = "$MIN" ]; then
            echo "Using runner default ($DEFAULT_VER)."
          else
            for xc in Xcode_16.2 Xcode_16.3 Xcode_16.4 Xcode_16.1; do
              if [ -d "/Applications/${xc}.app" ]; then
                sudo xcode-select -s "/Applications/${xc}.app"
                break
              fi
            done
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iOS|watchOS" || true
          xcrun simctl list runtimes | grep iOS || true

      - name: Install host tools
        run: brew install jq

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('package-lock.json', 'app.config.ts') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          # Key on JS/native deps only. Rust (Cargo.lock) changes shouldn't
          # blow the entire Xcode cache — the Rust cache step below covers
          # those artefacts.
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('package-lock.json', 'app.config.ts') }}
          restore-keys: ${{ runner.os }}-deriveddata-

      - name: Cache generated ios/ project
        uses: actions/cache@v4
        with:
          path: ios
          key: ${{ runner.os }}-ios-prebuild-${{ hashFiles('package-lock.json', 'app.config.ts') }}
          restore-keys: ${{ runner.os }}-ios-prebuild-

      - name: Install npm dependencies
        run: npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick iOS simulator UDID
        run: |
          # Pick a sim whose runtime is actually fully installed (i.e. the
          # platform package was downloaded, not just the SDK). The iOS
          # platform we installed via `xcodebuild -downloadPlatform` is
          # whichever iOS version Xcode picked as its default.
          INSTALLED_IOS=$(xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.isAvailable and (.name | startswith("iOS"))) | .identifier' | tail -1)
          echo "Using runtime: $INSTALLED_IOS"
          UDID=$(xcrun simctl list devices available -j \
            | jq -r --arg rt "$INSTALLED_IOS" '
                [ .devices | to_entries[]
                  | select(.key == $rt)
                  | .value[]
                  | select(.isAvailable and (.name | startswith("iPhone")))
                ] | .[0].udid // empty')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid')
          fi
          echo "Using simulator: $UDID"
          echo "IOS_SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: iOS / boot simulator
        run: ./test-ios.sh boot-sim

      - name: iOS / expo prebuild
        run: ./test-ios.sh prebuild

      - name: iOS / pod install
        run: ./test-ios.sh pods

      - name: iOS / build rust xcframework
        run: ./test-ios.sh rust-ios

      - name: iOS / xcodebuild
        run: ./test-ios.sh build

      - name: iOS / start Metro (background)
        run: ./test-ios.sh metro-start

      - name: iOS / install + launch app
        run: ./test-ios.sh install-launch

      - name: iOS / disable dev-menu onboarding
        run: ./test-ios.sh devmenu

      - name: iOS / Maestro flow
        run: ./test-ios.sh maestro

      - name: Upload iOS screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: screenshots/ios
          if-no-files-found: ignore

      - name: Upload iOS maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-maestro-debug
          path: ~/.maestro/tests
          if-no-files-found: ignore

  android:
    # Disabled while focusing CI on rust, lint, and web stability.
    if: false
    runs-on: namespace-profile-linux-medium
    timeout-minutes: 90
    env:
      ANDROID_API_LEVEL: "36"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CI submodules
        run: ./scripts/init-ci-submodules.sh

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ] && [ -d /etc/udev/rules.d ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "KVM not applicable on this runner; skipping."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # expo-bioscript's buildRustAndroid task requires all four Android
          # targets to be installed, even when we only build one arch.
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust (Android targets)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bioscript/rust
          key: android

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null; then
            cargo install cargo-ndk --locked
          fi

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Cache generated android/ project
        uses: actions/cache@v4
        with:
          path: android
          key: ${{ runner.os }}-android-prebuild-${{ hashFiles('package-lock.json', 'app.config.ts') }}
          restore-keys: ${{ runner.os }}-android-prebuild-

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ANDROID_API_LEVEL }}-pixel7-google_apis

      - name: Install npm dependencies
        run: npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-window -no-boot-anim -noaudio -camera-back none -gpu swiftshader_indirect
          disable-animations: false
          script: echo "AVD snapshot created"

      - name: Run Android tests / API ${{ env.ANDROID_API_LEVEL }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -no-boot-anim -noaudio -camera-back none -gpu swiftshader_indirect
          disable-animations: true
          script: ./test-android.sh

      - name: Upload Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: screenshots/android
          if-no-files-found: ignore

      - name: Upload Android maestro debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-debug
          path: ~/.maestro/tests
          if-no-files-found: ignore
