[package]
name = "biovault-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
bioscript-ffi = { path = "../../bioscript/rust/bioscript-ffi" }
bioscript-core = { path = "../../bioscript/rust/bioscript-core" }
bioscript-formats = { path = "../../bioscript/rust/bioscript-formats" }
bioscript-schema = { path = "../../bioscript/rust/bioscript-schema" }
bioscript-reporting = { path = "../../bioscript/rust/bioscript-reporting" }
bioscript-runtime = { path = "../../bioscript/rust/bioscript-runtime" }
monty = { path = "../../bioscript/monty/crates/monty" }
noodles = { version = "0.110.0", features = ["bam", "bgzf", "core", "cram", "csi", "fasta", "sam", "tabix", "vcf"] }
reqwest = { version = "0.13.2", features = ["blocking"] }
zip = "2.4.2"
sha2 = "0.10"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
noodles-bam = { path = "../../bioscript/noodles/noodles-bam" }
noodles-bgzf = { path = "../../bioscript/noodles/noodles-bgzf" }
noodles-core = { path = "../../bioscript/noodles/noodles-core" }
noodles-cram = { path = "../../bioscript/noodles/noodles-cram" }
noodles-csi = { path = "../../bioscript/noodles/noodles-csi" }
noodles-fasta = { path = "../../bioscript/noodles/noodles-fasta" }
noodles-sam = { path = "../../bioscript/noodles/noodles-sam" }
noodles-tabix = { path = "../../bioscript/noodles/noodles-tabix" }
noodles-vcf = { path = "../../bioscript/noodles/noodles-vcf" }
