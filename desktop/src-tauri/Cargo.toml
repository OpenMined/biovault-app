[package]
name = "biovault-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"

# Reuse existing Rust crates. Uncomment as you wire commands up.
# bioscript-core = { path = "../../bioscript/rust/bioscript-core" }
# bioscript-runtime = { path = "../../bioscript/rust/bioscript-runtime" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
